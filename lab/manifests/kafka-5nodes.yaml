# ─────────────────────────────────────────────────────────────
# Kafka KRaft 部署
# 架构：
#   controller : kafka-controller Pod，固定在 k8s-master
#                process.roles=controller，node.id=0
#                bootstrap 指向 localhost（单节点 quorum，无需选举）
#   broker x4  : kafka-broker StatefulSet，分布在 node1~4
#                process.roles=broker，node.id=1~4
#                bootstrap 指向 kafka-controller service
# ─────────────────────────────────────────────────────────────

apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: default
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: kafka-broker
  ports:
    - { name: broker, port: 9092, targetPort: 9092 }
    - { name: controller, port: 9093, targetPort: 9093 }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-svc
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: kafka-broker
  ports:
    - { name: broker, port: 9092, targetPort: 9092 }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-controller-svc
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: kafka-controller
  ports:
    - { name: controller, port: 9093, targetPort: 9093 }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-0-external
  namespace: default
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: kafka-broker
    statefulset.kubernetes.io/pod-name: kafka-broker-0
  ports:
    - { name: external, port: 9094, targetPort: 9094 }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-1-external
  namespace: default
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: kafka-broker
    statefulset.kubernetes.io/pod-name: kafka-broker-1
  ports:
    - { name: external, port: 9094, targetPort: 9094 }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-2-external
  namespace: default
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: kafka-broker
    statefulset.kubernetes.io/pod-name: kafka-broker-2
  ports:
    - { name: external, port: 9094, targetPort: 9094 }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-3-external
  namespace: default
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: kafka-broker
    statefulset.kubernetes.io/pod-name: kafka-broker-3
  ports:
    - { name: external, port: 9094, targetPort: 9094 }
---
# ── Controller Pod ───────────────────────────────────────────
# 固定在 k8s-master，toleration 绕过 control-plane taint
# process.roles=controller 只负责元数据管理，不处理业务流量
# quorum bootstrap 用 localhost，单节点无需外部选举
apiVersion: v1
kind: Pod
metadata:
  name: kafka-controller
  namespace: default
  labels:
    app: kafka-controller
spec:
  nodeSelector:
    kubernetes.io/hostname: k8s-master
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: kafka
      image: apache/kafka:4.0.2
      ports:
        - containerPort: 9093
      command:
        - sh
        - -c
        - |
          set -e
          FIXED_CLUSTER_ID="MkU3OEVBNTcwNTJENDM2Qg"

          {
            printf 'node.id=0\n'
            printf 'process.roles=controller\n'
            printf 'listeners=CONTROLLER://0.0.0.0:9093\n'
            printf 'advertised.listeners=CONTROLLER://kafka-controller-svc.default.svc.cluster.local:9093\n'
            printf 'listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT\n'
            printf 'controller.listener.names=CONTROLLER\n'
            printf 'controller.quorum.bootstrap.servers=localhost:9093\n'
            printf 'log.dirs=/var/kafka-data\n'
            printf 'auto.create.topics.enable=true\n'
          } >> /opt/kafka/config/server.properties

          if [ ! -f /var/kafka-data/meta.properties ]; then
            export KAFKA_OPTS="-Dsun.net.inetaddr.ttl=0 -Dsun.net.inetaddr.negative.ttl=0"
            /opt/kafka/bin/kafka-storage.sh format \
              --config /opt/kafka/config/server.properties \
              --cluster-id "$FIXED_CLUSTER_ID" \
              --standalone \
              --ignore-formatted
          fi

          export KAFKA_OPTS="-Dsun.net.inetaddr.ttl=0 -Dsun.net.inetaddr.negative.ttl=0"
          exec /opt/kafka/bin/kafka-server-start.sh \
            /opt/kafka/config/server.properties
      volumeMounts:
        - name: kafka-data
          mountPath: /var/kafka-data
  volumes:
    - name: kafka-data
      emptyDir: {}
---
# ── Broker StatefulSet ───────────────────────────────────────
# 4个 broker 并行启动，分布在 node1~4
# process.roles=broker，不参与 controller 选举
# 连接 kafka-controller-svc:9093 注册到 controller
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-broker
  namespace: default
spec:
  serviceName: kafka-headless
  replicas: 4
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: kafka-broker
  template:
    metadata:
      labels:
        app: kafka-broker
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: kafka-broker
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k8s-node1
                      - k8s-node2
                      - k8s-node3
                      - k8s-node4
      initContainers:
        - name: init-broker-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              POD_INDEX="${HOSTNAME##*-}"
              NODE_ID=$((POD_INDEX + 1))
              NODE_IP=$(cat /etc/kafka-node-ips/node-${POD_INDEX})
              NODE_PORT=$(cat /etc/kafka-node-ips/nodeport-${POD_INDEX})
              mkdir -p /etc/kafka-env
              printf 'KAFKA_NODE_ID=%s\n' "${NODE_ID}" > /etc/kafka-env/kafka.env
              printf 'KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-broker-%s.kafka-headless.default.svc.cluster.local:9092,EXTERNAL://%s:%s\n' \
                "${POD_INDEX}" "${NODE_IP}" "${NODE_PORT}" >> /etc/kafka-env/kafka.env
              echo "init done: NODE_ID=${NODE_ID} NODE_IP=${NODE_IP} NODE_PORT=${NODE_PORT}"
              cat /etc/kafka-env/kafka.env
          volumeMounts:
            - name: kafka-env
              mountPath: /etc/kafka-env
            - name: kafka-node-ips
              mountPath: /etc/kafka-node-ips
              readOnly: true
      containers:
        - name: kafka
          image: apache/kafka:4.0.2
          ports:
            - containerPort: 9092
            - containerPort: 9094
          command:
            - sh
            - -c
            - |
              set -e
              source /etc/kafka-env/kafka.env
              export KAFKA_NODE_ID
              export KAFKA_ADVERTISED_LISTENERS

              FIXED_CLUSTER_ID="MkU3OEVBNTcwNTJENDM2Qg"

              {
                printf 'node.id=%s\n'                    "${KAFKA_NODE_ID}"
                printf 'process.roles=broker\n'
                printf 'advertised.listeners=%s\n'       "${KAFKA_ADVERTISED_LISTENERS}"
                printf 'listeners=PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094\n'
                printf 'listener.security.protocol.map=PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT\n'
                printf 'inter.broker.listener.name=PLAINTEXT\n'
                printf 'controller.listener.names=CONTROLLER\n'
                printf 'controller.quorum.bootstrap.servers=kafka-controller-svc.default.svc.cluster.local:9093\n'
                printf 'log.dirs=/var/kafka-data\n'
                printf 'offsets.topic.replication.factor=3\n'
                printf 'default.replication.factor=3\n'
                printf 'min.insync.replicas=2\n'
                printf 'log.retention.hours=6\n'
                printf 'log.retention.bytes=1073741824\n'
                printf 'log.segment.bytes=134217728\n'
                printf 'auto.create.topics.enable=true\n'
              } >> /opt/kafka/config/server.properties

              if [ ! -f /var/kafka-data/meta.properties ]; then
                export KAFKA_OPTS="-Dsun.net.inetaddr.ttl=0 -Dsun.net.inetaddr.negative.ttl=0"
                /opt/kafka/bin/kafka-storage.sh format \
                  --config /opt/kafka/config/server.properties \
                  --cluster-id "$FIXED_CLUSTER_ID" \
                  --no-initial-controllers \
                  --ignore-formatted
              fi

              export KAFKA_OPTS="-Dsun.net.inetaddr.ttl=0 -Dsun.net.inetaddr.negative.ttl=0"
              exec /opt/kafka/bin/kafka-server-start.sh \
                /opt/kafka/config/server.properties
          volumeMounts:
            - name: kafka-data
              mountPath: /var/kafka-data
            - name: kafka-env
              mountPath: /etc/kafka-env
            - name: kafka-node-ips
              mountPath: /etc/kafka-node-ips
              readOnly: true
      volumes:
        - name: kafka-env
          emptyDir: {}
        - name: kafka-node-ips
          configMap:
            name: kafka-node-ips
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
