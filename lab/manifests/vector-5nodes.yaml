apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: kube-system
data:
  vector.yaml: |

    sources:
      hubble_flows:
        type: exec
        mode: streaming
        command:
          - /usr/local/bin/hubble
          - observe
          - --follow
          - --output=json
          # hubble-relay Service port=4245（02 的 helm install 已设置）
          - --server=hubble-relay.kube-system.svc.cluster.local:4245
          # relay 返回全集群事件；Vector 是 DaemonSet，每个节点一份。只拉本节点的事件，
          # 否则 5 份 Vector 各写一遍，Kafka 里每个事件重复约 5 次
          - --node-name=${NODE_NAME}
        streaming:
          respawn_on_exit: true
          respawn_interval_secs: 5

    transforms:
      parse_flow:
        type: remap
        inputs:
          - hubble_flows
        source: |
          parsed, err = parse_json(.message)
          if err != null { abort }
          . = parsed

      # 去掉采集链路自身的流量：Vector→Kafka、Hubble relay/peer、kube-system 组件。
      # 否则 "Hubble 记录 → Vector 写 Kafka → 写 Kafka 又被 Hubble 记录" 形成自激回路，
      # 抽样中这类流量占绝大多数，会淹没业务/攻击流量。
      drop_pipeline:
        type: filter
        inputs:
          - parse_flow
        condition: |
          f = object(.flow) ?? .
          src = object(f.source) ?? {}
          dst = object(f.destination) ?? {}
          ns = [string(src.namespace) ?? "", string(dst.namespace) ?? ""]
          lbl = (join(array(src.labels) ?? [], ",") ?? "") + "," + (join(array(dst.labels) ?? [], ",") ?? "")
          infra = includes(ns, "kube-system") ||
                  match(lbl, r'k8s:app=(kafka-broker|kafka-controller|vector)(,|$)|k8s:app\.kubernetes\.io/name=hubble-relay')
          !infra

    sinks:
      kafka_output:
        type: kafka
        inputs:
          - drop_pipeline
        bootstrap_servers: "${KAFKA_BOOTSTRAP}"
        topic: "ebpf-net-logs"
        encoding:
          codec: json
        batch:
          max_events: 500
          timeout_secs: 1
        # 缓冲满时 block：反压到 hubble observe，丢失会体现在 Hubble 的 lost events
        # 计数里（可查），而不是在这里静默丢掉。monitorAggregation=none 后事件量
        # 明显变大，缓冲相应调大。
        buffer:
          type: memory
          max_events: 200000
          when_full: block
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vector
subjects:
  - kind: ServiceAccount
    name: vector
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
    spec:
      serviceAccountName: vector
      tolerations:
        - operator: Exists
      initContainers:
        - name: install-hubble
          # quay.io/cilium/hubble:v0.13.0 binary 在 /usr/bin/hubble
          # cp 到 /shared/hubble，vector 从 /usr/local/bin 挂载后执行
          image: quay.io/cilium/hubble:v0.13.0
          command:
            - cp
            - /usr/bin/hubble
            - /shared/hubble
          volumeMounts:
            - name: shared-bin
              mountPath: /shared
      containers:
        - name: vector
          image: timberio/vector:0.38.0-distroless-libc
          args:
            - --config
            - /etc/vector/vector.yaml
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KAFKA_BOOTSTRAP
              valueFrom:
                secretKeyRef:
                  name: vector-kafka-secret
                  key: bootstrap_servers
            - name: VECTOR_LOG
              value: "warn"
          volumeMounts:
            - name: config-volume
              mountPath: /etc/vector
              readOnly: true
            - name: shared-bin
              mountPath: /usr/local/bin
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: config-volume
          configMap:
            name: vector-config
        - name: shared-bin
          emptyDir: {}
