---
# ── UDP 9999: echo ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: udp-echo
  namespace: targets
spec:
  selector:
    matchLabels:
      app: udp-echo
  template:
    metadata:
      labels:
        app: udp-echo
    spec:
      containers:
      - name: udp-echo
        image: alpine:3.19
        command: ["sh", "-c", "apk add -q python3 && python3 -c \"\nimport socket\ns=socket.socket(socket.AF_INET,socket.SOCK_DGRAM)\ns.bind(('',9999))\nwhile True:\n    d,a=s.recvfrom(4096)\n    s.sendto(d,a)\n\""]
        ports:
        - containerPort: 9999
          protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: udp-echo
  namespace: targets
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.100.213
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: udp-echo
  ports:
  - port: 9999
    targetPort: 9999
    protocol: UDP
---
