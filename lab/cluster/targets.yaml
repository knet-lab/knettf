apiVersion: v1
kind: Namespace
metadata:
  name: targets
---
# ── TCP 8080: HTTP API sim ─────────────────────────────────────────────────
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: http-api
  namespace: targets
spec:
  selector:
    matchLabels:
      app: http-api
  template:
    metadata:
      labels:
        app: http-api
    spec:
      containers:
      - name: http-api
        image: hashicorp/http-echo:latest
        args: ["-text=ok", "-listen=:8080"]
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: http-api
  namespace: targets
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.100.210
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: http-api
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
---
# ── TCP 3306: MySQL sim ────────────────────────────────────────────────────
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mysql-sim
  namespace: targets
spec:
  selector:
    matchLabels:
      app: mysql-sim
  template:
    metadata:
      labels:
        app: mysql-sim
    spec:
      containers:
      - name: mysql-sim
        image: alpine:3.19
        command: ["sh", "-c", "apk add -q socat && exec socat TCP-LISTEN:3306,fork,reuseaddr SYSTEM:'echo MySQL-Sim'"]
        ports:
        - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-sim
  namespace: targets
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.100.211
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: mysql-sim
  ports:
  - port: 3306
    targetPort: 3306
    protocol: TCP
---
