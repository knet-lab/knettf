name: check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# 按改动范围只跑相关检查（ops/scripts/ci-targets.sh）：只改 lab/、docs/、ops/ 时不启动
# PostgreSQL、不跑后端测试和前端构建。没跑的 job 是 skipped，自动部署视同通过。
jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      backend:  ${{ contains(steps.t.outputs.list, 'backend') }}
      frontend: ${{ contains(steps.t.outputs.list, 'frontend') }}
      light:    ${{ steps.t.outputs.light }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: t
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          list=$(ops/scripts/ci-targets.sh "$BASE")
          light=$(tr ' ' '\n' <<<"$list" | grep -E '^(lab|ops)$' | paste -sd' ' || true)
          echo "检查范围: $list"
          echo "list=$list"   >>"$GITHUB_OUTPUT"
          echo "light=$light" >>"$GITHUB_OUTPUT"

  light:
    needs: targets
    if: needs.targets.outputs.light != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ops/scripts/check.sh ${{ needs.targets.outputs.light }}

  backend:
    needs: targets
    if: needs.targets.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vigil
          POSTGRES_PASSWORD: vigil123
          POSTGRES_DB: vigil_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vigil" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: linux_development
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ops/scripts/check.sh backend

  frontend:
    needs: targets
    if: needs.targets.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # 版本取自 apps/frontend/package.json 的 packageManager
        with:
          package_json_file: apps/frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml
      - run: ops/scripts/check.sh frontend

  # 汇总：仓库规则（ruleset）要求名为 check 的检查通过才能合并，改名或删除前先改规则
  check:
    needs: [targets, light, backend, frontend]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "各项结果: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "✗ 有检查未通过"; exit 1 ;; esac
          done
